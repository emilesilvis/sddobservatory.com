name: Assess project drift

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      project:
        description: Project to assess (large projects need a one-time raised budget)
        required: true
        default: schematic
        type: choice
        options:
          - agentic-context-engine
          - akka-net
          - arcreel
          - desktop-cc-gui
          - growi
          - logitune
          - openspec
          - schematic
          - sokuji
          - uniclipboard
          - wukongim
          - yserver
      model:
        description: OpenAI model used for both isolated runs
        required: true
        default: gpt-5.6
        type: string
      max_tasks_per_run:
        description: Fail-closed semantic task budget per isolated run
        required: true
        default: '20'
        type: string
      force_baseline:
        description: Ignore existing state and rebuild a complete baseline
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  openai-credit-preflight:
    name: Check OpenAI credit availability
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Probe the Responses API
        id: probe
        env:
          MODEL: ${{ inputs.model || 'gpt-5.6' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "${response_file}"' EXIT
          payload=$(jq -nc --arg model "${MODEL}" '{model: $model, input: "Reply with OK.", max_output_tokens: 16, store: false}')
          status=$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${OPENAI_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            https://api.openai.com/v1/responses)
          error_code=$(jq -r '.error.code // empty' "${response_file}")
          error_type=$(jq -r '.error.type // empty' "${response_file}")

          if [[ "${status}" == '200' ]]; then
            echo 'available=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          case "${error_code}" in
            credit_balance_exhausted|organization_spend_limit_exceeded|project_spend_limit_exceeded|organization_usage_limit_exceeded)
              echo 'available=false' >> "${GITHUB_OUTPUT}"
              echo "::notice::Skipping drift assessments because OpenAI rejected the preflight with ${error_code}."
              ;;
            *)
              if [[ "${error_type}" == 'insufficient_quota' ]]; then
                echo 'available=false' >> "${GITHUB_OUTPUT}"
                echo '::notice::Skipping drift assessments because OpenAI reported insufficient quota.'
                exit 0
              fi
              echo "::error::OpenAI preflight failed with HTTP ${status} (${error_code:-unknown_error})."
              exit 1
              ;;
          esac

  assess:
    needs: openai-credit-preflight
    if: needs.openai-credit-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.project) || '["agentic-context-engine","akka-net","arcreel","desktop-cc-gui","growi","logitune","openspec","schematic","sokuji","uniclipboard","wukongim","yserver"]') }}
    concurrency:
      group: drift-assessment-${{ matrix.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check scheduled baseline readiness
        id: readiness
        env:
          EVENT_NAME: ${{ github.event_name }}
          PROJECT: ${{ matrix.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_safe=',agentic-context-engine,akka-net,logitune,schematic,sokuji,yserver,'
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' || "${baseline_safe}" == *",${PROJECT},"* ]]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/automation/drift-state-${PROJECT}" >/dev/null 2>&1; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
            echo "::notice::${PROJECT} needs one manual baseline before joining scheduled assessments"
          fi

      - if: steps.readiness.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.readiness.outputs.ready == 'true'
        run: npm ci
      - if: steps.readiness.outputs.ready == 'true'
        run: npm run drift:evidence:test
      - if: steps.readiness.outputs.ready == 'true'
        run: npm run drift:assess:v4:test

      - name: Snapshot current project head
        if: steps.readiness.outputs.ready == 'true'
        env:
          PROJECT: ${{ matrix.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run drift:snapshot -- \
            --manifest docs/research/drift-projects-prospective-2026-08-09.json \
            --slugs "${PROJECT}" \
            --output /tmp/drift-manifest.json

      - name: Build unbounded fallback when required
        if: steps.readiness.outputs.ready == 'true'
        env:
          PROJECT: ${{ matrix.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ",desktop-cc-gui,growi,wukongim," == *",${PROJECT},"* ]]; then
            npm run drift:evidence:prospective -- \
              --manifest /tmp/drift-manifest.json \
              --output-dir /tmp/sdd-drift-v4-raw \
              --unbounded \
              --slugs "${PROJECT}"
          fi

      - name: Compile selected project evidence
        if: steps.readiness.outputs.ready == 'true'
        env:
          PROJECT: ${{ matrix.project }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run drift:evidence:prospective -- \
            --manifest /tmp/drift-manifest.json \
            --output-dir /tmp/sdd-drift-v4-primary \
            --slugs "${PROJECT}"
          npm run drift:evidence:v4 -- \
            --primary-dir /tmp/sdd-drift-v4-primary \
            --fallback-dir /tmp/sdd-drift-v4-raw \
            --output-dir /tmp/sdd-drift-v4-packet \
            --slugs "${PROJECT}"
          npm run drift:evidence:v4:validate -- --packet-dir /tmp/sdd-drift-v4-packet

      - name: Run two isolated assessments
        if: steps.readiness.outputs.ready == 'true'
        env:
          PROJECT: ${{ matrix.project }}
          MODEL: ${{ inputs.model || 'gpt-5.6' }}
          MAX_TASKS: ${{ inputs.max_tasks_per_run || '20' }}
          FORCE_BASELINE: ${{ inputs.force_baseline || false }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            --project "${PROJECT}"
            --packet-dir /tmp/sdd-drift-v4-packet
            --model "${MODEL}"
            --max-tasks-per-run "${MAX_TASKS}"
            --skip-evidence-validation
            --publish-state
            --publish-draft-pr
            --repo "${GITHUB_REPOSITORY}"
          )
          if [[ "${FORCE_BASELINE}" == 'true' ]]; then
            args+=(--force-baseline)
          fi
          npm run drift:assess:v4 -- "${args[@]}"
